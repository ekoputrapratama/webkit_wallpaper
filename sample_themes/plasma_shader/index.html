<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:2em">WebGL not supported</p>'; throw 'no webgl'; }

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

const vs = `attribute vec2 p; void main(){gl_Position=vec4(p,0,1);}`;
const fs = `
precision mediump float;
uniform float t;
uniform vec2 r;
void main(){
  vec2 uv = gl_FragCoord.xy / r;
  float k = sin(uv.x * 6.2832 + t * 0.5) * cos(uv.y * 6.2832 - t * 0.3);
  float v = sin(uv.x * 3.0 + uv.y * 4.0 + t + k * 2.0) * 0.5 + 0.5;
  vec3 c1 = vec3(0.1, 0.05, 0.2);
  vec3 c2 = vec3(0.0, 0.4, 0.6);
  vec3 c3 = vec3(0.6, 0.1, 0.4);
  vec3 col = mix(c1, mix(c2, c3, v), v);
  col += 0.05 * sin(uv.xyx * 20.0 + t);
  gl_FragColor = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const pLoc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(pLoc);
gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

const tLoc = gl.getUniformLocation(prog, 't');
const rLoc = gl.getUniformLocation(prog, 'r');

function frame(ts) {
  gl.uniform1f(tLoc, ts * 0.001);
  gl.uniform2f(rLoc, canvas.width, canvas.height);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
